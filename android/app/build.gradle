plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stargrade.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.stargrade.app"
        minSdk 24
        targetSdk 34
        versionCode 220
        versionName "2.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Không cần thư viện ngoài phức tạp để ứng dụng siêu nhẹ (~2-3MB)
}

