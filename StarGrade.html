/* ===== styles.css ===== */
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#24242b;background:#f6f5f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f5f9}.shell{width:min(100% - 32px,680px);min-height:100vh;margin:auto;padding:16px 0 24px}.lazy-header{display:flex;align-items:center;justify-content:space-between;padding:0 2px 13px;border-bottom:1px solid #d9d8dd}.brand{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:800;color:#202027}.brand-button{border:0;background:transparent;padding:0;cursor:pointer}.brand-mark{display:block;width:34px;height:34px;border-radius:10px;object-fit:cover}.header-actions{display:flex;gap:6px}.theme-btn,.profile{display:grid;place-items:center;border:0;border-radius:50%;background:#fff;color:#4d4c54;width:34px;height:34px;cursor:pointer;box-shadow:0 2px 8px #2724330c}.profile{background:#0c897d;color:#fff;font-weight:800}.page-nav{display:flex;gap:7px;overflow:auto;margin:16px 0}.page-nav button,.btn{border:0;border-radius:11px;padding:10px 14px;background:#e5f4f2;color:#09796f;cursor:pointer;font-weight:750}.page-nav button{white-space:nowrap;background:#fff;color:#55545c;box-shadow:0 2px 8px #2724330a}.page-nav button.active,.btn.primary{background:#0c897d;color:#fff}.home-intro{padding:43px 4px 10px}.home-intro h1{font-size:29px;letter-spacing:-1px;margin:8px 0}.home-intro p{color:#74727c;margin:0;line-height:1.5}.eyebrow{font-size:12px!important;font-weight:800;letter-spacing:.09em;color:#777580!important}.home-actions{display:grid;gap:13px;margin:16px 0}.home-card{border:0;text-align:left;background:#fff;border-radius:23px;padding:20px;min-height:142px;box-shadow:0 9px 20px #27243312;cursor:pointer;color:#28272f;transition:transform .16s,box-shadow .16s}.home-card:hover{transform:translateY(-2px);box-shadow:0 13px 26px #27243319}.home-card.wide{display:flex;align-items:center;gap:14px;min-height:86px;padding:16px 20px}.home-card span:not(.home-icon){display:grid;gap:3px}.home-card b{font-size:16px}.home-card small{color:#777580;font-size:13px;font-weight:500;line-height:1.35}.home-card i{margin-left:auto;font-style:normal;color:#9c9aa3;font-size:27px}.home-icon{display:grid;place-items:center;flex:0 0 auto;width:47px;height:47px;border-radius:15px;background:#e5f5f2;color:#078277;font-size:27px;font-weight:500}.scan-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.home-pair{display:grid;grid-template-columns:1fr;gap:13px}.home-card.disabled{opacity:.5;cursor:not-allowed;transform:none!important}.home-note{display:grid;gap:4px;margin:26px 3px 0;padding:15px 17px;border:1px solid #dfdee4;border-radius:15px;background:#fbfafc;color:#65636c;font-size:13px}.home-note b{color:#38363e}.lazy-footer{margin-top:42px;border-top:1px solid #d9d8dd;padding:13px 4px 0;text-align:center;color:#85838b;font-size:12px}.lazy-footer button{border:0;background:transparent;padding:0;color:#5d5a64;cursor:pointer;font-weight:700}.muted{opacity:.75}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tabs button{border:0;border-radius:10px;padding:10px 14px;background:#e5f4f2;color:#09796f;cursor:pointer;font-weight:700}.tabs button.active{background:#0c897d;color:#fff}.card{background:#fff;border-radius:19px;padding:20px;box-shadow:0 6px 18px #2724330e;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}input,select,textarea{width:100%;padding:11px;border:1px solid #dedde3;border-radius:11px;margin:5px 0 10px;background:#fff;color:#26252c}label{font-size:13px;font-weight:700}.score-settings{display:grid;gap:12px;margin:10px 0 18px}.score-settings fieldset{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;border:1px solid #dfe8e6;border-radius:14px;padding:12px;background:#fbfefd}.score-settings legend{padding:0 6px;font-weight:800;color:#087a70}.score-settings label{display:block}.score-settings input{margin-bottom:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #edecf0;padding:10px 0}.badge{background:#e8f6f3;border-radius:999px;padding:4px 9px;font-size:12px}.danger{color:#bb3030}.hidden{display:none!important}.auth{max-width:430px;margin:8vh auto}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e9e8ed;text-align:left;font-size:13px}.preview{max-width:100%;max-height:260px;border-radius:12px}.toast{position:fixed;bottom:18px;right:18px;background:#27262d;color:#fff;padding:12px 15px;border-radius:10px;display:none}.score{font-size:28px;font-weight:800;color:#078277}.sheet-card{display:grid;grid-template-columns:1fr 160px;gap:14px;align-items:center;background:#f7fcfb;border:1px solid #d9efeb;border-radius:14px;padding:12px;margin:12px 0}.sheet-preview{width:160px;max-height:220px;object-fit:contain;border-radius:8px;background:#fff}body.night{background:#1e1e23;color:#f4f3f6}body.night .lazy-header,body.night .lazy-footer{border-color:#3e3d45}body.night .brand{color:#fff}body.night .theme-btn,body.night .card,body.night .home-card,body.night input,body.night select,body.night textarea,body.night .score-settings fieldset{background:#2a292f;color:#f4f3f6}body.night .page-nav button{background:#302f36;color:#efedf1}body.night .home-card small,body.night .home-intro p,body.night .lazy-footer{color:#b8b5bf}body.night .home-note{background:#28272d;border-color:#424149;color:#c8c5cd}@media(max-width:560px){.shell{width:min(100% - 24px,680px)}.home-intro{padding-top:30px}.home-card{min-height:110px}.sheet-card{grid-template-columns:1fr}.sheet-preview{width:100%;max-height:180px}.page-nav{margin:12px 0}.card{padding:15px}}

.name-crop{display:block;max-width:230px;max-height:48px;object-fit:contain;background:#fff}


/* ===== camera.css ===== */
.camera-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.camera-overlay{position:fixed;z-index:100;inset:0;background:#07090b;color:#fff;overflow:hidden}.camera-overlay video{width:100%;height:100%;object-fit:cover}.camera-top,.camera-bottom{position:absolute;left:0;right:0;padding:16px;display:flex;align-items:center;gap:16px;background:linear-gradient(#000a,transparent)}.camera-top{top:0}.camera-top b{font-size:15px}.camera-bottom{bottom:0;display:block;background:linear-gradient(transparent,#000d)}.camera-bottom p{margin:0 0 12px;font-size:13px;line-height:1.4}.camera-bottom .actions{justify-content:center}.camera-bottom .btn{background:#fff;color:#1f2626}.camera-bottom .btn.primary{background:#0c897d;color:#fff}.camera-guide{position:absolute;left:50%;top:50%;width:min(82vw,53vh);aspect-ratio:1552/2254;transform:translate(-50%,-50%);border:2px solid #22c7b8;border-radius:7px;box-shadow:0 0 0 9999px #0004;pointer-events:none}.camera-guide:before,.camera-guide:after,.camera-guide span:before,.camera-guide span:after{content:"";position:absolute;width:18px;height:18px;border:3px solid #fff;background:#0c897d88;box-shadow:0 0 0 2px #0008}.camera-guide:before{left:3.2%;top:2.2%;transform:translate(-50%,-50%)}.camera-guide:after{right:3.2%;top:2.2%;transform:translate(50%,-50%)}.camera-guide span:before{left:3.2%;bottom:2.2%;transform:translate(-50%,50%)}.camera-guide span:after{right:3.2%;bottom:2.2%;transform:translate(50%,50%)}


/* ===== camera-crop.css ===== */
/* Khung chụp đúng tỉ lệ khổ A4. Video phủ toàn màn hình; ảnh lưu chỉ là vùng này. */
.camera-guide{width:min(96vw,63.64vh);aspect-ratio:210/297;border:3px solid #22c7b8;border-radius:4px}.camera-guide:before,.camera-guide:after,.camera-guide span:before,.camera-guide span:after{width:22px;height:22px;border-width:3px;background:#117e75aa}.camera-guide:before{left:3.2%;top:2.2%}.camera-guide:after{right:3.2%;top:2.2%}.camera-guide span:before{left:3.2%;bottom:2.2%}.camera-guide span:after{right:3.2%;bottom:2.2%}


/* ===== camera-fov.css ===== */
/* Giữ toàn bộ góc nhìn gốc của camera, không cắt zoom để lấp màn hình. */
.camera-overlay video{object-fit:contain}


/* ===== grade-theme.css ===== */
:root{--grade-green:#129d08;--grade-dark:#087300;--grade-teal:#048e91;color-scheme:light;font-family:Arial,"Segoe UI",sans-serif;background:#eff5ed;color:#203524}
body{background:#eff5ed;color:#203524}.shell.lazy-shell{width:100%;padding:0 0 24px;position:relative}.lazy-header{min-height:70px;padding:15px max(24px,calc((100vw - 1060px)/2));background:var(--grade-green);border:0;color:#fff;position:relative;z-index:2;box-shadow:0 2px 7px #07350015}.brand,.brand-button{color:#fff;font-size:24px;letter-spacing:-.4px}.brand-mark{width:31px;height:31px;border-radius:6px}.theme-btn,.profile{width:34px;height:34px;background:#ffffff22;color:#fff;box-shadow:none}.profile{border:1px solid #ffffff70}.header-actions{gap:10px}
#view,.page-nav,.lazy-footer{position:relative;z-index:1;width:min(100% - 40px,1000px);margin-left:auto;margin-right:auto}.page-nav{padding:4px 0 12px;gap:8px;margin-top:19px;margin-bottom:6px;scrollbar-width:thin}.page-nav button{background:#fff;color:#28652a;border:1px solid #dce9d8;border-radius:6px;box-shadow:none;padding:11px 15px}.page-nav button.active{background:var(--grade-green);color:#fff;border-color:var(--grade-green)}

.review-dialog,.warnings-dialog{padding:0;border:1px solid #bad2b6;border-radius:12px;background:#fff;color:#203524;box-shadow:0 12px 65px #102b2860;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px)}
.review-dialog{width:1240px;height:calc(100dvh - 24px);overflow:hidden}
.review-dialog[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.review-dialog::backdrop,.warnings-dialog::backdrop{background:#102b28b3}

  function saveStore(data) {

  // Pure JS port of PHP scoring.php: grade_submission
  function gradeSubmission(row, key, exam) {
    let p1 = 0, p2 = 0, p3 = 0, flags = [];
    const points = exam.part2_points || [0.1, 0.25, 0.5, 1.0];
    const qCount = Number(exam.question_count || (key.answers || '').length);

    // Part 1
    for (let i = 0; i < qCount; i++) {
      const a = (row.answers || '')[i] || '-';
      const b = (key.answers || '')[i] || '-';
      if (a === '-' || a === '') {
        flags.push('Phần I câu ' + (i + 1) + ' bỏ trống');
      } else if (!['A', 'B', 'C', 'D'].includes(a)) {
        flags.push('Phần I câu ' + (i + 1) + ' cần kiểm tra');
      } else if (['A', 'B', 'C', 'D'].includes(b) && a === b) {
        p1 += Number(exam.part1_point || 0.25);
      }
    }

    // Part 2
    const p2Count = Number(exam.part2_count || (key.part2 || []).length);
    for (let i = 0; i < p2Count; i++) {
      const a = Array.from((row.part2 || [])[i] || '');
      const b = Array.from((key.part2 || [])[i] || '');
      let right = 0;
      if (!a.some(v => v !== '-')) {
        flags.push('Phần II câu ' + (i + 1) + ' bỏ trống');
      } else if (a.some(v => !['Đ', 'S', '-'].includes(v))) {
        flags.push('Phần II câu ' + (i + 1) + ' cần kiểm tra');
      }
      for (let j = 0; j < 4; j++) {
        if (['Đ', 'S'].includes(b[j] || '') && (a[j] || '') === b[j]) {
          right++;
        }
      }
      if (right > 0) {
        p2 += Number(points[right - 1] || 0);
      }
    }

    // Part 3
    const p3Count = Number(exam.part3_count || (key.part3 || []).length);
    for (let i = 0; i < p3Count; i++) {
      const a = String((row.part3 || [])[i] || '').trim();
      const b = String((key.part3 || [])[i] || '').trim();
      if (a === '') {
        flags.push('Phần III câu ' + (i + 1) + ' bỏ trống');
      } else if (a.includes('?') || a.includes('*')) {
        flags.push('Phần III câu ' + (i + 1) + ' cần kiểm tra');
      } else if (b !== '' && a === b) {
        p3 += Number(exam.part3_point || 0.5);
      }
    }

    p1 = Math.round(p1 * 100) / 100;
    p2 = Math.round(p2 * 100) / 100;
    p3 = Math.round(p3 * 100) / 100;
    const score = Math.round((p1 + p2 + p3) * 100) / 100;

    return {
      ...row,
      parts: { part1: p1, part2: p2, part3: p3 },
      score: score,
      flags: flags
    };
  }

  function regradeExam(store, examId) {

    if (!exam) return 0;

    store.keys.filter(k => k.exam_id === examId).forEach(k => { keysMap[k.code] = k; });

    store.submissions.forEach((sub, idx) => {
      if (sub.exam_id === examId && !sub.deleted_at) {
        const key = keysMap[sub.code];
        if (key) {
          store.submissions[idx] = gradeSubmission(sub, key, exam);
          count++;
        }
      }
    });
    return count;
  }

  // Intercept window.fetch to handle /api requests completely client-side

    // /exams/:id/submissions (POST)
    const mSubmissions = path.match(/^\/exams\/(\d+)\/submissions$/);
    if (mSubmissions && method === 'POST') {
      const examId = Number(mSubmissions[1]);

    const mSubEdit = path.match(/^\/exams\/(\d+)\/submissions\/(\d+)$/);

      const oldSub = store.submissions[subIdx];

    const mResults = path.match(/^\/exams\/(\d+)\/results$/);

    }

    // /exams/:id/export (GET)
    const mExport = path.match(/^\/exams\/(\d+)\/export$/);

          'Content-Type': 'text/csv; charset=utf-8',
          'Content-Disposition': 'attachment; filename="bang-diem.csv"'

/* ===== reference-omr.js ===== */
/* ==========================================================
 * BỘ NHẬN DIỆN PHIẾU TÔ QUANG HỌC OMR (THUẦN JAVASCRIPT)
 * Quy trình:
 * 1. Chuyển ảnh xám (Grayscale conversion)
 * 2. Tìm 12 mốc vuông đen trên các góc và viền phiếu
 * 3. Tính ma trận phép chiếu Homography để nắn phẳng toạ độ
 * 4. Đo độ đậm nhạt từng ô tô và nhận diện đáp án, SBD, mã đề
 * ========================================================== */

/* Bộ nhận diện phiếu tô (thuần JavaScript, không phụ thuộc thư viện).
 *
 * Quy trình:  ảnh xám -> tìm 12 mốc vuông đen -> phép chiếu (homography)
 *             -> đo độ đậm từng ô -> quyết định ô được tô.
 * Toạ độ mẫu phiếu tính bằng cm (xem templates.json), H biến (cm) -> (pixel ảnh).
 */
var OMR = (function () {
  'use strict';

  // ---------- ảnh xám ----------
  function xam(img) {
    var s = img.data, n = img.width * img.height, d = new Uint8Array(n);
    for (var i = 0, j = 0; i < n; i++, j += 4) d[i] = (s[j] * 77 + s[j + 1] * 150 + s[j + 2] * 29) >> 8;
    return { w: img.width, h: img.height, d: d };
  }

  // ---------- đại số ----------
  function giai(A, b) {            // khử Gauss có chọn trụ, A: n x n
    var n = b.length, i, j, k;
    for (i = 0; i < n; i++) {
      var p = i;
      for (k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[p][i])) p = k;
      if (Math.abs(A[p][i]) < 1e-12) return null;
      var t = A[i]; A[i] = A[p]; A[p] = t; var tb = b[i]; b[i] = b[p]; b[p] = tb;
      for (k = i + 1; k < n; k++) {
        var f = A[k][i] / A[i][i];
        if (!f) continue;
        for (j = i; j < n; j++) A[k][j] -= f * A[i][j];
        b[k] -= f * b[i];
      }
    }
    var x = new Array(n);
    for (i = n - 1; i >= 0; i--) {
      var s = b[i];
      for (j = i + 1; j < n; j++) s -= A[i][j] * x[j];
      x[i] = s / A[i][i];
    }
    return x;
  }

  // Phép chiếu bình phương tối thiểu từ >= 4 cặp điểm  a[i] -> b[i]
  // (chuẩn hoá toạ độ hai phía về quanh gốc, cỡ ~1 để hệ phương trình ổn định)
  function chuan(p) {
    var n = p.length, mx = 0, my = 0, s = 0, i;
    for (i = 0; i < n; i++) { mx += p[i][0]; my += p[i][1]; }
    mx /= n; my /= n;
    for (i = 0; i < n; i++) s += Math.hypot(p[i][0] - mx, p[i][1] - my);
    s = s / n || 1;
    return [mx, my, s];
  }
  function phepChieu(a, b) {

(function(root){
  function parseQuickAnswers(text,count){
    const source=String(text).trim().toUpperCase().replace(/^ĐÁP\s*ÁN\s*[:：]?\s*/u,'');
    const matches=[...source.matchAll(/(?:^|[\s,;|])(?:CÂU\s*)?(\d+)\s*(?:[.):=\-]\s*|\s+)([ABCD?\-])(?=$|[\s,;|])/gu)];
    if(matches.length){
      const out=Array(count).fill('-'),seen=new Set();
      let rest=source;
      for(const m of matches){const q=Number(m[1]);if(q<1||q>count)throw Error(`Câu ${q} nằm ngoài số câu của bài thi (${count}).`);if(seen.has(q))throw Error(`Câu ${q} xuất hiện nhiều lần.`);seen.add(q);out[q-1]=m[2];rest=rest.replace(m[0],' ')}
      if(rest.replace(/[\s,;|]+/g,''))throw Error('Có nội dung chưa đọc được. Dùng dạng 1.A 2.B hoặc chuỗi ABCD.');
      return {answers:out.join(''),count:seen.size};
    }
    const clean=source.replace(/[\s,;|.]+/g,'');
    if(/[^ABCD?\-]/.test(clean))throw Error('Chỉ nhập A/B/C/D, hoặc dạng 1.A 2.B.');
    if(clean.length>count)throw Error(`Có ${clean.length} đáp án, bài thi chỉ có ${count} câu.`);
    return {answers:clean.padEnd(count,'-'),count:clean.length};
  }
  root.parseQuickAnswers=parseQuickAnswers;
  if(typeof module!=='undefined')module.exports=parseQuickAnswers;
})(typeof window==='undefined'?globalThis:window);

function examStatistics(rows){

  return {count:scores.length,average:scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null,highest:scores.length?Math.max(...scores):null,lowest:scores.length?Math.min(...scores):null,warnings:rows.filter(row=>row.flags?.length).length,byCode};

ist.add('active');$('#name').classList.toggle('hidden',b.dataset.auth==='login');$('#submitAuth').textContent=b.dataset.auth==='login'?'Đăng nhập':'Tạo tài khoản';$('#submitAuth').dataset.mode=b.dataset.auth});$('#submitAuth').onclick=async()=>{try{const mode=$('#submitAuth').dataset.mode||'login';state.user=(await api('/auth/'+mode,{method:'POST',body:JSON.stringify({name:$('#name').value,username:$('#username').value,password:$('#password').value})})).user;await loadExams();render()}catch(e){$('#authErr').textContent=e.message}}}

function renderHome(v){
  const items=[['exams','Bài kiểm tra'],['students','Học sinh & Lớp học'],['downloads','Tải phiếu chấm'],['settings','Cài đặt'],['account','Tài khoản'],['help','Trợ giúp & Hướng dẫn']];
  v.innerHTML='<div class="home-backdrop" aria-hidden="true"></div><section class="grade-menu" aria-label="Menu chính"><h1 class="visually-hidden">StarGrade — Menu chính</h1>'+items.map(([key,label])=>`<button class="grade-menu-button" data-home="${key}"><span class="grade-menu-icon">${menuIcon(key)}</span><span>${label}</span></button>`).join('')+'</section><p class="home-exam-status"></p>';
  v.querySelector('.home-exam-status').textContent=state.exam?'Bài đang chọn: '+state.exam.name:'Chọn Bài kiểm tra để tạo hoặc mở bài thi.';
  v.querySelectorAll('[data-home]').forEach(button=>button.onclick=()=>{const target=button.dataset.home,requiresExam=['students'].includes(target);state.tab=requiresExam&&!state.exam?'exams':target;render();if(requiresExam&&!state.exam)toast('Hãy tạo hoặc mở bài kiểm tra trước.')});
}
function renderHelp(v){
  v.innerHTML=`<section class="card help-card"><p class="help-eyebrow">STARGRADE</p><h1>Trợ giúp & Hướng dẫn</h1><p>Tạo bài kiểm tra, lưu đáp án, sau đó chụp phiếu để chấm và đối chiếu kết quả.</p>
    <details open><summary>1. Tạo bài kiểm tra</summary><p>Vào Bài kiểm tra, chọn đúng mẫu phiếu giấy, nhập tên bài và mã đề. Điều chỉnh số câu, điểm từng phần rồi bấm Tạo bài thi.</p></details>
    <details><summary>2. Nhập và lưu đáp án</summary><p><a class="btn" href="/assets/mau-nhap-dap-an.xlsx" download>Tải file Excel mẫu nhập đáp án</a></p><p>File mẫu gồm đáp án minh họa cho bốn mã đề. Giữ hàng tiêu đề, thay mã đề và đáp án bằng dữ liệu của bạn; mã đề cần khớp với bài thi. Phần I điền A/B/C/D, Phần II điền Đ/S từng ý, Phần III giữ dấu âm và dấu phẩy. Để trống các câu không dùng. Nhập Excel bằng nút biểu tượng Excel trong mục Đáp án, kiểm tra bản xem trước rồi xác nhận nhập.</p><p>Vào từng bài thi, mở Đáp án và chọn mã đề cần nhập. Bấm ô A/B/C/D, Đ/S hoặc nhập câu trả lời ngắn. Có thể dán chuỗi đáp án Phần I hoặc tải phiếu đã tô. Kiểm tra rồi bấm Lưu toàn bộ đáp án cho mỗi mã đề.</p></details>
    <details><summary>3. Nhập học sinh và lớp học</summary><p>Dán danh sách CSV trong Danh sách lớp với dòng đầu: SBD,Họ tên,Lớp. Giữ các số 0 ở đầu SBD. Nếu không ghép được tên, kết quả hiển thị ảnh vùng họ tên hoặc số phách trên phiếu.</p></details>
    <details><summary>4. Chụp và chấm phiếu</summary><p>Mở Chấm phiếu, chọn Chụp bằng camera hoặc Tải ảnh có sẵn. Đặt phiếu phẳng, đủ sáng, giữ rõ bốn mốc đen. Kiểm tra và sửa SBD, mã đề, đáp án nhận dạng trước khi bấm Chấm và lưu.</p><p>Camera cần địa chỉ HTTPS hợp lệ và quyền truy cập camera. Nếu chụp không được, mở bằng Chrome hoặc Safari.</p></details>

reviewMarks=function(row,key){if(!isHorizontalSheet()&&!['bgd2025original','bgd2025pink','phutho','qmcv1239','qmcv4'].includes(state.exam?.sheet_template))return reviewMarksVertical(row,key);const tpl=activeSheetTemplate(),k=tpl.khung;const ring=(p,color)=>reviewRing((p[0]-k[0])/(k[2]-k[0])*1552,(p[1]-k[1])/(k[3]-k[1])*2254,color);let marks='';for(const [value,groups]of [[row.student_no,tpl.sbd],[row.code,tpl.made]])String(value||'').split('').forEach((digit,i)=>{if(/^\d$/.test(digit)&&groups[i]?.[Number(digit)])marks+=ring(groups[i][Number(digit)],'correct')});if(!key)return marks;tpl.p1.slice(0,part1Count()).forEach((points,i)=>{const given='ABCD'.indexOf((row.answers||'')[i]),correct='ABCD'.indexOf((key.answers||'')[i]);if(given>=0)marks+=ring(points[given],given===correct?'correct':'wrong');if(correct>=0&&given!==correct)marks+=ring(points[correct],'expected')});if(['bgd2025original','bgd2025pink','phutho','qmcv1239','qmcv4'].includes(state.exam?.sheet_template)&&key){tpl.p2.slice(0,part2Count()*4).forEach((points,i)=>{const q=Math.floor(i/4),r=i%4,a='ĐS'.indexOf((row.part2?.[q]||'')[r]),b='ĐS'.indexOf((key.part2?.[q]||'')[r]);if(a>=0)marks+=ring(points[a],a===b?'correct':'wrong');if(b>=0&&a!==b)marks+=ring(points[b],'expected')});tpl.p3.slice(0,part3Count()).forEach((cols,q)=>{const given=row.part3?.[q]||'',expected=key.part3?.[q]||'';for(const [value,color]of [[given,given===expected?'correct':'wrong'],[given===expected?'':expected,'expected']])Array.from(value).forEach((char,col)=>{const row=tpl.p3hang.indexOf(char);if(cols[col]?.[row])marks+=ring(cols[col][row],color)})})}return marks};
function enableIdentityEditing(v){
  const old=$('#code'),field=document.createElement('input'),suggestions=document.createElement('datalist');
  field.id='code';field.type='text';field.inputMode='numeric';field.autocomplete='off';field.maxLength=state.exam?.sheet_template==='tn40n'?3:4;field.value=old.value;field.setAttribute('list','examCodeSuggestions');field.setAttribute('aria-label','Mã đề, có thể sửa sau nhận dạng');
  suggestions.id='examCodeSuggestions';for(const code of state.exam.codes){const option=document.createElement('option');option.value=code;suggestions.appendChild(option)}old.replaceWith(field);field.after(suggestions);
  field.parentElement.insertAdjacentHTML('beforeend','<small class="muted">Có thể sửa mã đề hoặc chọn mã đã có đáp án.</small>');
  const student=$('#studentNo');student.type='text';student.inputMode='numeric';student.autocomplete='off';student.setAttribute('aria-label','Số báo danh, có thể sửa sau nhận dạng');student.parentElement.insertAdjacentHTML('beforeend','<small class="muted">Có thể sửa số báo danh sau khi đọc phiếu.</small>');
  const update=()=>{const readout=$('#omrReadout');if(readout)readout.textContent=`Dữ liệu dùng để chấm: ${['qm40','tnmaker40'].includes(state.exam?.sheet_template)?'':'SBD '+student.value+' · '}Mã đề ${field.value}`};field.addEventListener('input',update);student.addEventListener('input',update);
}
const renderExamForm=renderExams;
renderExams=function(v){
  renderExamForm(v);
  v.querySelectorAll('[data-select]').forEach(button=>{const edit=document.createElement('button');edit.className='btn';edit.textContent='Sửa bài thi';edit.onclick=async()=>{try{await selectExam(button.dataset.select);state.editExamId=state.exam.id;state.tab='exams';render()}catch(e){toast(e.message)}};button.before(edit)});
  if(!state.editExamId)return;
  const exam=state.exam;if(exam?.id!==state.editExamId){state.editExamId=null;return}
  v.querySelector('h2').textContent='Sửa bài thi';const selector=$('#sheetTemplate');if(exam.sheet_template==='tn40n')selector.insertAdjacentHTML('beforeend','<option value="tn40n">Phiếu ngang cũ · 40 câu · mã đề 3 số</option>');selector.value=exam.sheet_template||'bgd2';selector.onchange();selector.disabled=true;
  $('#templateHint').textContent+=' · Mẫu phiếu được giữ cố định.';
  const fields={examName:exam.name,subject:exam.subject,codes:exam.codes.join(','),count1:exam.question_count,count2:exam.part2_count??8,count3:exam.part3_count??6,part1Point:exam.part1_point??.25,part3Point:exam.part3_point??.5};
  (exam.part2_points||[.1,.25,.5,1]).forEach((p,i)=>fields['part2Point'+(i+1)]=p);for(const [id,value]of Object.entries(fields))$('#'+id).value=value;
  const save=$('#createExam');save.textContent='Lưu thay đổi và sửa đáp án';save.insertAdjacentHTML('afterend',' <button class="btn" id="cancelExamEdit">Hủy sửa</button>');$('#cancelExamEdit').onclick=()=>{state.editExamId=null;render()};
  save.onclick=async()=>{save.disabled=true;try{await api('/exams/'+exam.id,{method:'PUT',body:JSON.stringify({sheet_template:exam.sheet_template||'bgd2',name:$('#examName').value,subject:$('#subject').value,codes:$('#codes').value.split(','),question_count:$('#count1').value,part2_count:$('#count2').value,part3_count:$('#count3').value,part1_point:$('#part1Point').value,part3_point:$('#part3Point').value,...Object.fromEntries([1,2,3,4].map(i=>['part2_point_'+i,$('#part2Point'+i).value]))})});await loadExams();await selectExam(exam.id);state.editExamId=null;state.tab='keys';render();toast('Đã cập nhật bài thi. Chọn mã đề để sửa và lưu đáp án.')}catch(e){toast(e.message);save.disabled=false}};
};
function renderDownloads(v){
  const sheets=sheetCatalog;
  v.innerHTML='<div class="card"><h2>Tải phiếu</h2><p class="muted">Chọn đúng mẫu phiếu đã thiết lập cho bài thi. Các file bên dưới là phiếu trắng để tải và in.</p></div>'+sheets.map(s=>`<section class="card"><h3>${s.name}</h3><p class="muted">${s.description}</p><div class="sheet-card"><a href="${s.image}" target="_blank" rel="noopener" aria-label="Xem ${s.name}"><img class="sheet-preview" src="${s.image}" alt="${s.name}" loading="lazy"></a><div class="actions"><a class="btn primary" href="${s.image}" download>Tải ảnh phiếu</a>${s.pdf?`<a class="btn" href="${s.pdf}" download>Tải PDF</a>`:''}<a class="btn" href="${s.image}" target="_blank" rel="noopener">Xem phiếu</a></div></div></section>`).join('');
}
